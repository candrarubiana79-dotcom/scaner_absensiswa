<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner HP Guru - SMPN 1 RANCAH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 font-sans">

  <div class="max-w-md mx-auto w-full space-y-4">
    <!-- Header -->
    <div class="text-center py-4 bg-slate-800 rounded-2xl border border-slate-700 shadow-lg">
      <h1 class="text-xl font-bold text-indigo-400"><i class="fa-solid fa-camera-retro mr-2"></i>Scanner Presensi</h1>
      <p class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wider">SMPN 1 RANCAH</p>
    </div>

    <!-- Kamera Area -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl text-center">
      <div id="reader" class="overflow-hidden rounded-xl bg-black border-2 border-slate-600 mb-4"></div>
      
      <button id="btnStart" onclick="startScanner()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-play"></i> Buka Kamera Scanner
      </button>
      <button id="btnStop" onclick="stopScanner()" class="w-full bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl font-semibold transition hidden flex items-center justify-center gap-2">
        <i class="fa-solid fa-stop"></i> Tutup Kamera
      </button>
    </div>

    <!-- Kotak Hasil Scan -->
    <div id="statusBox" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 hidden text-center">
      <h2 id="statusNama" class="text-lg font-bold"></h2>
      <p id="statusDetail" class="text-xs text-slate-300 mt-1"></p>
    </div>
  </div>

  <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";
    const TOKEN_GURU = "GURU2026"; 

    let html5QrCode;
    let isProcessing = false;
    let masterSiswaLokal = [];

    // Preload Data Master Siswa saat halaman pertama kali dibuka
    document.addEventListener("DOMContentLoaded", () => {
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          masterSiswaLokal = data.master || [];
        })
        .catch(err => console.log("Gagal preload master data, tetap mengandalkan server."));
    });

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 220, height: 220 } },
        onScanSuccess
      ).then(() => {
        document.getElementById("btnStart").classList.add("hidden");
        document.getElementById("btnStop").classList.remove("hidden");
      }).catch(err => alert("Kamera Gagal Dibuka: " + err));
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById("btnStart").classList.remove("hidden");
          document.getElementById("btnStop").classList.add("hidden");
        });
      }
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      // 1. BUNYI BEEP SEKETIKA (< 0.1 detik)
      const beep = document.getElementById("beepSound");
      if (beep) {
        beep.currentTime = 0;
        beep.play().catch(e => console.log("Audio error:", e));
      }

      // 2. CARI DATA SISWA LOKAL DI MEMORI HP
      const targetCode = String(decodedText).trim().toLowerCase();
      const siswaDitemukan = masterSiswaLokal.find(s => 
        String(s.nisn).trim().toLowerCase() === targetCode || 
        targetCode.includes(String(s.nama).trim().toLowerCase())
      );

      const box = document.getElementById("statusBox");
      box.classList.remove("hidden");

      if (siswaDitemukan) {
        box.className = "bg-emerald-900/90 border border-emerald-500 p-4 rounded-2xl text-center";
        document.getElementById("statusNama").textContent = "Mencatat: " + siswaDitemukan.nama;
        document.getElementById("statusDetail").textContent = "Kelas " + siswaDitemukan.kelas + " • Menyimpan ke server...";
      } else {
        box.className = "bg-indigo-900/90 border border-indigo-500 p-4 rounded-2xl text-center animate-pulse";
        document.getElementById("statusNama").textContent = "Memproses QR...";
        document.getElementById("statusDetail").textContent = "Mengirim data ke server...";
      }

      // 3. PROSES PENGIRIMAN KE SERVER DI BACKGROUND
      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ 
          code: decodedText,
          token: TOKEN_GURU 
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          box.className = "bg-emerald-900/90 border border-emerald-500 p-4 rounded-2xl text-center";
          document.getElementById("statusNama").textContent = res.message || "Absen Berhasil Dicatat!";
          document.getElementById("statusDetail").textContent = "QR Terdeteksi: " + decodedText;
        } else {
          box.className = "bg-rose-900/90 border border-rose-500 p-4 rounded-2xl text-center";
          document.getElementById("statusNama").textContent = "Gagal Absen!";
          document.getElementById("statusDetail").textContent = res.message || "Data ditolak oleh server.";
        }
      })
      .catch(err => {
        box.className = "bg-rose-900/90 border border-rose-500 p-4 rounded-2xl text-center";
        document.getElementById("statusNama").textContent = "Gagal Mengirim!";
        document.getElementById("statusDetail").textContent = "Periksa koneksi internet Anda.";
      })
      .finally(() => {
        // Cooldown dipercepat ke 800ms
        setTimeout(() => { 
          isProcessing = false; 
        }, 800);
      });
    }
  </script>
</body>
</html>
