<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Absensi Siswa</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: 'Segoe UI', System-UI, sans-serif;
      background-color: #0F172A;
      color: white;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #38BDF8;
    }
    #reader {
      width: 100%;
      background: #1E293B;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 2px solid #334155;
    }
    .input-group {
      margin-bottom: 12px;
      text-align: left;
    }
    label { font-size: 13px; color: #94A3B8; font-weight: bold; }
    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1E293B;
      color: white;
      margin-top: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .status-card {
      padding: 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      margin-top: 16px;
      display: none;
    }
    .success { background: #166534; color: #DCFCE7; border: 1px solid #22C55E; }
    .warning { background: #854D0E; color: #FEF08A; border: 1px solid #EAB308; }
    .error { background: #991B1B; color: #FEE2E2; border: 1px solid #EF4444; }
  </style>
</head>
<body>

<div class="container">
  <h2>📷 Scanner Absensi QR Code</h2>

  <div class="input-group">
    <label>Token Guru Piket:</label>
    <input type="password" id="token" value="GURU2026">
  </div>

  <div class="input-group">
    <label>Pilih Kelas Siswa:</label>
    <select id="kelas">
      <option value="7A">Kelas 7A</option>
      <option value="7B">Kelas 7B</option>
      <option value="8A">Kelas 8A</option>
      <option value="8B">Kelas 8B</option>
      <option value="9A">Kelas 9A</option>
    </select>
  </div>

  <div id="reader"></div>
  <div id="statusBox" class="status-card"></div>
</div>

<script>
  // ⚠️ GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx.../exec";
  let isProcessing = false;

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    const token = document.getElementById('token').value;
    const kelas = document.getElementById('kelas').value;

    showStatus("⏳ Memproses data absensi...", "warning");

    fetch(`${SCRIPT_URL}?action=scan&token=${token}&kelas=${kelas}&nama=${encodeURIComponent(decodedText)}`)
      .then(res => res.json())
      .then(res => {
        if(res.success) {
          const isLate = res.message.includes("KESIANGAN");
          showStatus(res.message, isLate ? "warning" : "success");
          playBeep(isLate ? 400 : 800);
        } else {
          showStatus(res.message, "error");
          playBeep(200);
        }
        setTimeout(() => { isProcessing = false; }, 2500);
      })
      .catch(err => {
        showStatus("❌ GAGAL: Terjadi kesalahan jaringan!", "error");
        setTimeout(() => { isProcessing = false; }, 2500);
      });
  }

  function showStatus(text, type) {
    const box = document.getElementById('statusBox');
    box.className = `status-card ${type}`;
    box.innerHTML = text;
    box.style.display = 'block';
  }

  function playBeep(freq) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.frequency.value = freq;
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
  }

  const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
  html5QrcodeScanner.render(onScanSuccess);
</script>
</body>
</html>
