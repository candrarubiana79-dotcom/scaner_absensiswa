<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner HP Guru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 font-sans">

  <div class="max-w-md mx-auto w-full space-y-4">
    <!-- Header -->
    <div class="text-center py-4 bg-slate-800 rounded-2xl border border-slate-700 shadow-lg">
      <h1 class="text-xl font-bold text-indigo-400"><i class="fa-solid fa-camera-retro mr-2"></i>Scanner Presensi Guru</h1>
      <p class="text-xs text-slate-400 mt-1">Otentikasi Pengaman: <span class="text-yellow-400 font-mono font-bold">GURU2026</span></p>
    </div>

    <!-- Kamera Area -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl text-center">
      <div id="reader" class="overflow-hidden rounded-xl bg-black border-2 border-slate-600 mb-4"></div>
      
      <button id="btnStart" onclick="startScanner()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-semibold transition">
        <i class="fa-solid fa-play mr-2"></i> Buka Kamera Scanner
      </button>
      <button id="btnStop" onclick="stopScanner()" class="w-full bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl font-semibold transition hidden">
        <i class="fa-solid fa-stop mr-2"></i> Tutup Kamera
      </button>
    </div>

    <!-- Kotak Hasil Scan -->
    <div id="statusBox" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 hidden text-center">
      <h2 id="statusNama" class="text-lg font-bold"></h2>
      <p id="statusDetail" class="text-xs text-slate-300 mt-1"></p>
    </div>
  </div>

  <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";
    const TOKEN_GURU = "GURU2026";

    let html5QrCode;
    let isProcessing = false;

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess
      ).then(() => {
        document.getElementById("btnStart").classList.add("hidden");
        document.getElementById("btnStop").classList.remove("hidden");
      }).catch(err => alert("Kamera Gagal Dibuka: " + err));
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById("btnStart").classList.remove("hidden");
          document.getElementById("btnStop").classList.add("hidden");
        });
      }
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const box = document.getElementById("statusBox");
      box.classList.remove("hidden");
      box.className = "bg-slate-800 p-4 rounded-2xl border border-indigo-500 text-center animate-pulse";
      document.getElementById("statusNama").textContent = "Memproses...";
      document.getElementById("statusDetail").textContent = "Mengirim data scan ke server...";

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ 
          code: decodedText,
          token: TOKEN_GURU 
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          // Play Beep hanya jika sukses
          const beep = document.getElementById("beepSound");
          if (beep) {
            beep.currentTime = 0;
            beep.play().catch(e => console.log("Audio error:", e));
          }

          box.className = "bg-emerald-900/90 border border-emerald-500 p-4 rounded-2xl text-center";
          document.getElementById("statusNama").textContent = res.message || "Absen Berhasil Dicatat!";
          document.getElementById("statusDetail").textContent = "QR Terdeteksi: " + decodedText;
        } else {
          // Tampilkan pesan error jika duplikat / gagal dari server
          box.className = "bg-rose-900/90 border border-rose-500 p-4 rounded-2xl text-center";
          document.getElementById("statusNama").textContent = "Gagal Absen!";
          document.getElementById("statusDetail").textContent = res.message || "Data ditolak oleh server.";
        }
      })
      .catch(err => {
        box.className = "bg-rose-900/90 border border-rose-500 p-4 rounded-2xl text-center";
        document.getElementById("statusNama").textContent = "Gagal Mengirim!";
        document.getElementById("statusDetail").textContent = "Periksa koneksi internet Anda.";
      })
      .finally(() => {
        // Jeda 2.5 detik sebelum siap menerima scan berikutnya
        setTimeout(() => { 
          isProcessing = false; 
        }, 2500);
      });
    }
  </script>
</body>
</html>
