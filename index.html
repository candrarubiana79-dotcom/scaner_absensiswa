<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner HP Guru - SMPN 1 RANCAH (v3.5 Progress UI)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white h-screen overflow-hidden flex flex-col justify-between p-3 font-sans">

  <div class="max-w-md mx-auto w-full flex-1 flex flex-col justify-start space-y-2.5">
    
    <!-- 1. HEADER + INDIKATOR STATUS -->
    <div class="text-center py-2.5 px-3 bg-slate-800 rounded-xl border border-slate-700 shadow-md">
      <div class="flex items-center justify-center gap-2">
        <h1 class="text-lg font-bold text-indigo-400"><i class="fa-solid fa-camera-retro mr-1.5"></i>Scanner Presensi</h1>
        <span class="text-[10px] font-extrabold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full">v3.5</span>
      </div>
      <p class="text-[10px] font-bold text-slate-400 mt-0.5 uppercase tracking-wider">SMPN 1 RANCAH</p>
      
      <!-- Lencana Indikator Sinyal & Offline Queue -->
      <div class="mt-1.5 flex flex-wrap justify-center gap-1.5">
        <span id="dataStatus" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
          <i class="fa-solid fa-spinner fa-spin"></i> Memuat data...
        </span>
        <span id="offlineBadge" class="hidden inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500 text-slate-950 shadow-sm animate-pulse">
          <i class="fa-solid fa-box-archive"></i> <span id="offlineCount">0</span> Antrean Offline
        </span>
      </div>

      <!-- BAR STATUS PENGIRIMAN OFFLINE (NEW) -->
      <div id="progressContainer" class="hidden mt-2 pt-1 border-t border-slate-700/50">
        <div class="flex justify-between items-center text-[10px] text-amber-400 font-semibold mb-1 px-1">
          <span id="progressText"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> Mengirim antrean...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-amber-400 h-full w-0 transition-all duration-300 ease-out rounded-full shadow-[0_0_8px_rgba(251,191,36,0.5)]"></div>
        </div>
      </div>
    </div>

    <!-- 2. KOTAK HASIL SCAN (NOTIFIKASI INSTAN) -->
    <div id="statusBox" class="bg-slate-800 p-3 rounded-xl border border-slate-700 hidden text-center transition-all duration-200 shadow-lg">
      <h2 id="statusNama" class="text-base font-bold"></h2>
      <p id="statusDetail" class="text-xs text-slate-300 mt-0.5"></p>
    </div>

    <!-- 3. AREA KAMERA SCANNER -->
    <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 shadow-xl text-center flex-1 flex flex-col justify-center min-h-0">
      <div id="reader" class="overflow-hidden rounded-lg bg-black border-2 border-slate-600 mb-2.5 w-full flex items-center justify-center"></div>
      
      <button id="btnStart" onclick="startScanner()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 shadow-lg">
        <i class="fa-solid fa-play"></i> Buka Kamera Scanner
      </button>
      <button id="btnStop" onclick="stopScanner()" class="w-full bg-rose-600 hover:bg-rose-500 active:scale-95 text-white py-2.5 rounded-xl font-semibold text-sm transition hidden flex items-center justify-center gap-2 shadow-lg">
        <i class="fa-solid fa-stop"></i> Tutup Kamera
      </button>
    </div>

  </div>

  <!-- FOOTER -->
  <footer class="text-center text-[10px] text-slate-500 pt-1">
    Presensi Digital • SMPN 1 Rancah <span class="font-bold text-slate-400">v3.5 Progress UI</span>
  </footer>

  <script>
    const APP_VERSION = "v3.5";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";
    const TOKEN_GURU = "GURU2026"; 
    const BATCH_SIZE = 15;

    let html5QrCode = null;
    let audioCtx = null;
    let isProcessing = false;
    let masterSiswaLokal = [];
    
    let lastScannedCode = "";
    let lastScannedTime = 0;
    let autoHideTimer = null;
    let isSyncing = false;
    let totalOfflineSync = 0;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = "sine";
        osc.frequency.value = 900;
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.log("Audio Error:", e);
      }
    }

    function getOfflineQueue() {
      return JSON.parse(localStorage.getItem("presensi_offline_queue") || "[]");
    }

    function saveOfflineQueue(queue) {
      localStorage.setItem("presensi_offline_queue", JSON.stringify(queue));
      updateOfflineUI();
    }

    function updateOfflineUI() {
      const queue = getOfflineQueue();
      const badge = document.getElementById("offlineBadge");
      const countEl = document.getElementById("offlineCount");
      
      if (queue.length > 0) {
        badge.classList.remove("hidden");
        countEl.textContent = queue.length;
      } else {
        badge.classList.add("hidden");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const statusEl = document.getElementById("dataStatus");
      updateOfflineUI();

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          masterSiswaLokal = data.master || [];
          localStorage.setItem("masterSiswaCache", JSON.stringify(masterSiswaLokal));
          if (statusEl) {
            statusEl.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
            statusEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> Siap (${masterSiswaLokal.length} Siswa)`;
          }
          syncOfflineData();
        })
        .catch(err => {
          masterSiswaLokal = JSON.parse(localStorage.getItem("masterSiswaCache") || "[]");
          if (statusEl) {
            statusEl.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20";
            statusEl.innerHTML = `<i class="fa-solid fa-wifi"></i> Mode Offline (${masterSiswaLokal.length} Siswa)`;
          }
        });

      window.addEventListener("online", syncOfflineData);
    });

    function startScanner() {
      initAudio();

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      if (html5QrCode.isScanning) return;

      html5QrCode.start(
        { facingMode: "environment" },
        { 
          fps: 15, 
          qrbox: (viewfinderWidth, viewfinderHeight) => {
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            return { width: Math.floor(minEdge * 0.7), height: Math.floor(minEdge * 0.7) };
          },
          aspectRatio: 1.0
        },
        onScanSuccess
      ).then(() => {
        document.getElementById("btnStart").classList.add("hidden");
        document.getElementById("btnStop").classList.remove("hidden");
      }).catch(err => alert("Kamera Gagal Dibuka: " + err));
    }

    function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          document.getElementById("btnStart").classList.remove("hidden");
          document.getElementById("btnStop").classList.add("hidden");
        });
      }
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      const targetCode = String(decodedText).trim().toLowerCase();

      if (targetCode === lastScannedCode && (now - lastScannedTime) < 2500) return;
      if (isProcessing) return;
      isProcessing = true;

      lastScannedCode = targetCode;
      lastScannedTime = now;

      if (autoHideTimer) clearTimeout(autoHideTimer);

      playBeep();

      const siswaDitemukan = masterSiswaLokal.find(s => 
        String(s.nisn).trim().toLowerCase() === targetCode
      );

      const namaSiswa = siswaDitemukan ? siswaDitemukan.nama : "Siswa QR: " + decodedText;
      const detailSiswa = siswaDitemukan ? ("Kelas " + siswaDitemukan.kelas) : "QR Terdeteksi";

      const box = document.getElementById("statusBox");
      const elNama = document.getElementById("statusNama");
      const elDetail = document.getElementById("statusDetail");

      elNama.textContent = namaSiswa;
      elDetail.textContent = detailSiswa + " • ⚡ Mencatat...";
      box.className = "bg-indigo-900/90 border border-indigo-500 p-3 rounded-xl text-center shadow-lg transition-all duration-150";
      box.classList.remove("hidden");

      setTimeout(() => { isProcessing = false; }, 500);

      const currentScanCode = targetCode;

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ 
          code: decodedText,
          token: TOKEN_GURU 
        })
      })
      .then(res => res.json())
      .then(res => {
        if (lastScannedCode === currentScanCode) {
          if (res.status === "success") {
            box.className = "bg-emerald-900/90 border border-emerald-500 p-3 rounded-xl text-center shadow-lg";
            elNama.textContent = "✅ " + (siswaDitemukan ? siswaDitemukan.nama : res.message);
            elDetail.textContent = detailSiswa + " • Waktu: " + (res.jam || "WIB");
          } else {
            box.className = "bg-amber-900/90 border border-amber-500 p-3 rounded-xl text-center shadow-lg";
            elNama.textContent = "⚠️ " + namaSiswa;
            elDetail.textContent = res.message || "Data ditolak server.";
          }
        }
      })
      .catch(err => {
        const queue = getOfflineQueue();
        const timestampLokal = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        
        queue.push({
          code: decodedText,
          token: TOKEN_GURU,
          time: timestampLokal,
          scanTime: new Date().toISOString()
        });
        
        saveOfflineQueue(queue);

        if (lastScannedCode === currentScanCode) {
          box.className = "bg-amber-900/90 border border-amber-500 p-3 rounded-xl text-center shadow-lg";
          elNama.textContent = "📦 " + namaSiswa;
          elDetail.textContent = detailSiswa + " • Tersimpan Offline (Sinyal Lemah)";
        }
      })
      .finally(() => {
        autoHideTimer = setTimeout(() => {
          if (lastScannedCode === currentScanCode) {
            box.classList.add("hidden");
          }
        }, 3000);

        syncOfflineData();
      });
    }

    // SINKRONISASI & LOGIKA PROGRESS BAR
    function syncOfflineData() {
      if (isSyncing) return;
      const currentQueue = getOfflineQueue();
      if (currentQueue.length === 0) return;

      if (totalOfflineSync === 0 || totalOfflineSync < currentQueue.length) {
        totalOfflineSync = currentQueue.length;
      }

      isSyncing = true;
      updateProgressBar(currentQueue.length, totalOfflineSync);

      const chunkToSync = currentQueue.slice(0, BATCH_SIZE);

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          tipe: "batch_offline",
          token: TOKEN_GURU,
          batch: chunkToSync
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          let freshQueue = getOfflineQueue();
          freshQueue.splice(0, chunkToSync.length);
          saveOfflineQueue(freshQueue);

          updateProgressBar(freshQueue.length, totalOfflineSync);
        }
        isSyncing = false;

        if (getOfflineQueue().length > 0) {
          setTimeout(syncOfflineData, 300);
        } else {
          completeProgressBar();
        }
      })
      .catch(err => {
        isSyncing = false;
      });
    }

    function updateProgressBar(remainingCount, totalCount) {
      const container = document.getElementById("progressContainer");
      const pText = document.getElementById("progressText");
      const pBar = document.getElementById("progressBar");
      const pPercent = document.getElementById("progressPercent");

      if (!container || !pBar) return;

      container.classList.remove("hidden");
      
      const completed = totalCount - remainingCount;
      const percent = totalCount > 0 ? Math.round((completed / totalCount) * 100) : 100;

      pBar.style.width = percent + "%";
      if (pPercent) pPercent.textContent = percent + "%";
      if (pText) pText.innerHTML = `<i class="fa-solid fa-cloud-arrow-up mr-1 animate-bounce"></i> Mengirim (${completed}/${totalCount})...`;
    }

    function completeProgressBar() {
      const container = document.getElementById("progressContainer");
      const pText = document.getElementById("progressText");
      const pBar = document.getElementById("progressBar");
      const pPercent = document.getElementById("progressPercent");

      if (!pBar) return;

      pBar.style.width = "100%";
      if (pPercent) pPercent.textContent = "100%";
      if (pText) pText.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Semua Data Terkirim`;

      setTimeout(() => {
        if (getOfflineQueue().length === 0) {
          if (container) container.classList.add("hidden");
          totalOfflineSync = 0;
        }
      }, 3500);
    }
  </script>
</body>
</html>
